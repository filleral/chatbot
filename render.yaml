# Blueprint de Render. Al conectar este repo en https://dashboard.render.com/blueprints
# crea el servicio web automáticamente. Los valores marcados sync:false se ponen a mano
# en Render → el servicio → Environment (para no dejar secretos en el repo).

services:
  - type: web
    name: whatsapp-bot-inmobiliaria
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio          # misma zona que Neon (us-east-2) para menor latencia con la BD
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WhatsApp__VerifyToken
        sync: false
      - key: WhatsApp__AccessToken
        sync: false
      - key: WhatsApp__PhoneNumberId
        sync: false
      - key: WhatsApp__AdvisorPhoneNumber
        sync: false
      - key: PostgresConnectionString
        sync: false
      - key: Dashboard__Email
        sync: false
      - key: Dashboard__Password
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__User
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__From
        sync: false
      - key: Email__To
        sync: false
      - key: PropertyScraper__ListingUrl
        value: https://bienesraiceswhite.co/inmuebles/
      - key: PropertyScraper__MaxPages
        value: "3"
      - key: PropertyScraper__CacheMinutes
        value: "10"
